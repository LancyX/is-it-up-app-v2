services:
  backend:
    build: ./backend
    ports:
      - "8033:8000"
    restart: always
    environment:
      - HA_BASE_URL=${HA_BASE_URL:-http://host.docker.internal:8123}
      - HA_TOKEN=${HA_TOKEN}
      - GRID_ENTITY_ID=${GRID_ENTITY_ID:-binary_sensor.grid_power}
      - SCHEDULE_REGION=${SCHEDULE_REGION:-}
      - SCHEDULE_QUEUE=${SCHEDULE_QUEUE:-}
      - SCHEDULE_API_URL=${SCHEDULE_API_URL:-https://svitlo-proxy.svitlo-proxy.workers.dev}
      - SCHEDULE_EMERGENCY_API_URL=${SCHEDULE_EMERGENCY_API_URL-https://dtek-api.svitlo-proxy.workers.dev/}
      - DATA_DIR=/data
    volumes:
      - schedule-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_GITHUB_REPO_URL: ${VITE_GITHUB_REPO_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_APP_SUBTITLE: ${VITE_APP_SUBTITLE:-}
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    ports:
      - "3033:80"
    restart: always
    depends_on:
      - backend

volumes:
  schedule-data:
